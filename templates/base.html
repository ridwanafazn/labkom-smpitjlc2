<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Labkom — Sistem Peminjaman{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M18 20h28v22H18z' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M24 48h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="toast-stack" id="toastStack" aria-live="polite">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="toast toast-{{ category }}" role="status">
        <span>{{ message }}</span>
        <button type="button" class="toast-close" aria-label="Tutup" onclick="this.parentElement.remove()">&times;</button>
      </div>
      {% endfor %}
    {% endwith %}
  </div>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='photo-compress.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
