{% extends "base.html" %}
{% block body_class %}app-body{% endblock %}
{% block body %}
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <strong>Labkom</strong>
      <span>SMK IT JLC 2</span>
    </div>
    <nav class="nav" aria-label="Navigasi utama">
      <button type="button" class="nav-item active" data-view="dashboard" onclick="showView('dashboard', this)">Dashboard</button>
      <button type="button" class="nav-item" data-view="guru" onclick="showView('guru', this)">Peminjaman guru</button>
      <button type="button" class="nav-item" data-view="murid" onclick="showView('murid', this)">Scan QR murid</button>
      <button type="button" class="nav-item" data-view="riwayat" onclick="showView('riwayat', this)">Riwayat</button>
      {% if is_admin %}
      <button type="button" class="nav-item" data-view="admin" onclick="showView('admin', this)">Manajemen</button>
      {% endif %}
    </nav>
    <div class="sidebar-foot">
      <div class="user">
        <strong>{{ current_user }}</strong>
        <span>{{ 'Admin Labkom' if is_admin else 'Guru' }}</span>
      </div>
      <a href="{{ url_for('logout') }}">Keluar</a>
    </div>
  </aside>

  <div class="main">
    <header class="mobile-head">
      <button type="button" class="menu-button" onclick="toggleSidebar()">Menu</button>
      <strong>Labkom</strong>
    </header>
    <main class="content">
      {% include "_notices.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<div class="backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
{% endblock %}
